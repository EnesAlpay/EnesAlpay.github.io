
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Küçük Bir Mola ☕🍪</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at center, #1a100f 0%, #090505 70%, #020101 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Arka plandaki soft parıltılar */
.bg-glow {
    position: absolute;
    width: min(80vw, 500px);
    height: min(80vw, 500px);
    background: radial-gradient(circle, rgba(212, 163, 115, 0.04), transparent 70%);
    filter: blur(40px);
    pointer-events: none;
    z-index: 1;
}

/* Üst Başlık */
.header-area {
    text-align: center;
    z-index: 5;
    margin-bottom: 30px;
}

.header-area h1 {
    font-weight: 300;
    font-size: 1.5rem;
    color: #d4a373;
    text-shadow: 0 0 20px rgba(212, 163, 115, 0.2);
    margin-bottom: 8px;
}

.header-area p {
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.5px;
    line-height: 1.4;
}

/* --- SAHNE ALANI --- */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    z-index: 10;
}

/* Kahve Dumanı Animasyonu */
.steam-line {
    animation: riseSteam 3s infinite linear;
}
.steam-2 { animation-delay: 0.8s; }
.steam-3 { animation-delay: 1.5s; }

@keyframes riseSteam {
    0% { transform: translateY(5px) scaleX(1); opacity: 0; }
    50% { transform: translateY(-10px) scaleX(1.3); opacity: 0.4; }
    100% { transform: translateY(-25px) scaleX(0.7); opacity: 0; }
}

/* --- ŞANS KURABİYESİ ALANI --- */
.cookie-wrapper {
    position: relative;
    width: 160px;
    height: 120px;
    cursor: pointer;
    perspective: 1000px;
}

.cookie-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* Kırılma parçalarının animasyon tanımları */
.cookie-left, .cookie-right {
    transform-origin: center;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Kurabiye kırıldığında parçaların ayrılma efekti */
.cookie-wrapper.broken .cookie-left {
    transform: translateX(-45px) translateY(15px) rotate(-25px);
}

.cookie-wrapper.broken .cookie-right {
    transform: translateX(45px) translateY(15px) rotate(25px);
}

/* Gölge efekti kurabiye kırılınca hafiflesin */
.cookie-shadow {
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform-origin: center;
}
.cookie-wrapper.broken .cookie-shadow {
    opacity: 0.3;
    transform: scaleX(1.3);
}

/* --- KAĞIT MESAJ KART ALANI --- */
.card-overlay {
    position: fixed;
    inset: 0;
    background: rgba(12, 7, 6, 0.85);
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
}

.motto-card {
    width: min(90%, 400px);
    background: #fffdfa;
    color: #3d2621;
    padding: 35px 30px;
    border-radius: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    transform: translateY(50px) scale(0.7);
    opacity: 0;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.15), opacity 0.4s ease;
    text-align: center;
    border-left: 5px solid #d4a373; /* Fal kağıdı şeridi gibi */
}

.motto-text {
    font-family: 'Georgia', serif;
    font-size: 1.1rem;
    line-height: 1.7;
    color: #4e342e;
    margin-bottom: 25px;
}

.close-btn {
    padding: 10px 24px;
    background: #8b5e3c;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(139,94,60,0.3);
    transition: all 0.3s ease;
}

.close-btn:hover {
    background: #d4a373;
    transform: translateY(-1px);
}

/* Kıvılcım Animasyonu */
.sparkle {
    position: fixed;
    font-size: 20px;
    pointer-events: none;
    animation: driftUp 2s ease-out forwards;
    z-index: 150;
}

@keyframes driftUp {
    0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) rotate(20deg) scale(1.2); opacity: 0; }
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="header-area">
    <h1>Sana ufak bir kahve molası getirdim... ☕</h1>
    <p>Hadi kurabiyeyi çıtlat da bakalım bugün şansına ne çıkacak? ✨</p>
</div>

<div class="container">
    <!-- 1. KAHVE ALANI (SVG) -->
    <svg width="160" height="120" viewBox="0 0 160 120" style="overflow: visible;">
        <!-- Dumanlar -->
        <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3">
            <path class="steam-line steam-1" d="M 65,30 Q 60,15 70,5 T 60,-10" />
            <path class="steam-line steam-2" d="M 80,30 Q 85,15 75,5 T 85,-10" />
            <path class="steam-line steam-3" d="M 95,30 Q 90,15 100,5 T 90,-10" />
        </g>
        <!-- Kahve Fincanı Kulpu -->
        <path d="M 115,55 C 135,55 135,85 115,85" fill="none" stroke="#cfa77d" stroke-width="10" stroke-linecap="round" />
        <!-- Fincan Gövdesi -->
        <path d="M 45,45 L 115,45 C 115,85 45,85 45,45 Z" fill="#dfba96" />
        <!-- İçindeki Kahve Sıvısı -->
        <ellipse cx="80" cy="45" rx="35" ry="6" fill="#4a2c11" />
        <!-- Tabak -->
        <ellipse cx="80" cy="90" rx="55" ry="10" fill="#bfa07d" />
        <ellipse cx="80" cy="88" rx="55" ry="10" fill="#cca885" />
    </svg>

    <!-- 2. ŞANS KURABİYESİ ALANI (SVG + Tıklama Etkileşimi) -->
    <div class="cookie-wrapper" id="fortuneCookie" onclick="breakCookie(event)">
        <svg class="cookie-svg" viewBox="0 0 160 120">
            <!-- Kurabiye Gölgesi -->
            <ellipse class="cookie-shadow" cx="80" cy="110" rx="50" ry="8" fill="#000" opacity="0.5" />
            
            <!-- SOL PARÇA -->
            <g class="cookie-left">
                <!-- Sol Gövde Ana Yapı -->
                <path d="M 80,30 C 40,25 15,50 25,85 C 32,100 55,100 80,85 Z" fill="#e2a76f" stroke="#cc8e52" stroke-width="1" />
                <!-- İç Kıvrım Detayı -->
                <path d="M 40,65 C 50,55 65,65 80,68" fill="none" stroke="#b8783d" stroke-width="2" stroke-linecap="round" />
                <!-- Kırılma Kenarı Dişleri -->
                <path d="M 80,30 L 78,40 L 82,50 L 79,62 L 81,74 L 80,85" fill="none" stroke="#d39559" stroke-width="2" />
            </g>
            
            <!-- SAĞ PARÇA -->
            <g class="cookie-right">
                <!-- Sağ Gövde Ana Yapı -->
                <path d="M 80,30 C 120,25 145,50 135,85 C 128,100 105,100 80,85 Z" fill="#edb57e" stroke="#cc8e52" stroke-width="1" />
                <!-- İç Kıvrım Detayı -->
                <path d="M 120,65 C 110,55 95,65 80,68" fill="none" stroke="#c68549" stroke-width="2" stroke-linecap="round" />
                <!-- Kırılma Kenarı Dişleri (Sol parça ile birleşen yer) -->
                <path d="M 80,30 L 78,40 L 82,50 L 79,62 L 81,74 L 80,85" fill="none" stroke="#e2a76f" stroke-width="2" />
            </g>
        </svg>
    </div>
</div>

<!-- Sürpriz Mesaj Fal Kağıdı -->
<div class="card-overlay" id="cardOverlay">
    <div class="motto-card" id="mottoCard">
        <div class="motto-text" id="mottoText"></div>
        <button class="close-btn" onclick="resetCookie()">Gülümse ✨</button>
    </div>
</div>

<script>
// Doğal, günlük, mesafeli ama aşırı sıcak şans kurabiyesi mottoları
const mottos = [
    "Şuraya gününü güzelleştirecek tatlı bir kurabiye ve bir tutam neşe bırakıyorum. Umarım bugün her şey dilediğin gibi kolay ve keyifli geçer! ☀️",
    "Günün nasıl geçiyor bilmiyorum ama umarım çok yorulmuyorsundur. Arada derin bir nefes alıp kendine vakit ayırmayı unutma, tamam mı?",
    "Hayat bazen çok hızlı akıyor ama senin o sakin, samimi ve tatlı enerjin etrafındaki her şeye çok iyi geliyor. İyi ki varsın!",
    "Bugün karşına çıkan ufak tefek aksilikler olursa hiç modunu düşürme. Sen hepsinin üstesinden çok tatlı bir şekilde gelirsin, sana inanıyorum. ✨",
    "Yoğun günlerin arasında seninle iki çift laf etmek ya da sadece varlığını hissetmek bile günü güzelleştirmeye yetiyor. Kendine çok iyi bak.",
    "Bugün attığın her adımda şansın seninle olmasını dilerim. İşlerin su gibi aksın, yüzündeki o güzel tebessüm hiç eksik olmasın! 🍀",
    "Umarım günün sonunda tatlı bir yorgunlukla arkana yaslanıp dinlendiğin, çok huzurlu bir akşam geçirirsin. Şimdiden kolay gelsin!"
];

let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

// Kurabiyenin Kırılması Animasyonu
function breakCookie(event) {
    const cookie = document.getElementById('fortuneCookie');
    
    if (cookie.classList.contains('broken')) return;
    
    cookie.classList.add('broken');
    
    // Kuru çıtırtı / kırılma sesi sentezleme
    playCrackSound();

    // Kurabiye tam ayrılırken etrafa pırıltı saç ve kağıdı çıkar
    setTimeout(() => {
        spawnSparkles(event);
        
        const overlay = document.getElementById('cardOverlay');
        const card = document.getElementById('mottoCard');
        const textEl = document.getElementById('mottoText');
        
        // Rastgele bir not seç
        const randomMotto = mottos[Math.floor(Math.random() * mottos.length)];
        textEl.textContent = randomMotto;
        
        overlay.style.display = 'flex';
        
        setTimeout(() => {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0) scale(1)';
            playPaperSound();
        }, 50);

    }, 550); // Tam kırılma anında açılması için senkronize edildi
}

// Her şeyi eski haline getirme (Kurabiye birleşir)
function resetCookie() {
    const card = document.getElementById('mottoCard');
    const overlay = document.getElementById('cardOverlay');
    const cookie = document.getElementById('fortuneCookie');

    card.style.opacity = '0';
    card.style.transform = 'translateY(50px) scale(0.7)';

    setTimeout(() => {
        overlay.style.display = 'none';
        cookie.classList.remove('broken');
    }, 400);
}

// Parıltı Efekti (Kurabiyeden fırlayan tatlı simgeler)
function spawnSparkles(e) {
    const cx = e.clientX || window.innerWidth / 2;
    const cy = e.clientY || window.innerHeight / 2;
    const icons = ['✨', '💫', '🍀', '☀️', '🍪'];
    
    for (let i = 0; i < 30; i++) {
        const sp = document.createElement('div');
        sp.className = 'sparkle';
        sp.innerHTML = icons[Math.floor(Math.random() * icons.length)];
        sp.style.left = cx + 'px';
        sp.style.top = cy + 'px';

        const angle = Math.random() * Math.PI * 2;
        const dist = 50 + Math.random() * 200;
        
        sp.style.setProperty('--x', Math.cos(angle) * dist + 'px');
        sp.style.setProperty('--y', (Math.sin(angle) * dist - 30) + 'px');

        document.body.appendChild(sp);
        setTimeout(() => sp.remove(), 2000);
    }
}

// --- SES SENTEZLEYİCİLERİ (Audio API) ---
function playCrackSound() {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    // Kısa ve çıtır bir gürültü dalgası (Kurabiye kırılması tınısı)
    const bufferSize = audioCtx.sampleRate * 0.08;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1000, now);
    
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.06, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(now);
}

function playPaperSound() {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    // Kağıt hışırtısı / Ding birleşimi yumuşak bir açılış sesi
    const freqs = [440, 554.37, 659.25]; // La - Do# - Mi
    freqs.forEach((f, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + index * 0.05);
        
        gain.gain.setValueAtTime(0.02, now + index * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.05);
        osc.stop(now + 0.5);
    });
}
</script>

</body>
</html>
